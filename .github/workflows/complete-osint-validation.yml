name: Complete OSINT contribution gates
on:
  push:
    branches: [research/complete-osint-prs-20261015]
permissions:
  contents: read
jobs:
  verify:
    name: PR ${{ matrix.pr }} · ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 1
            sha: d34f9298502cfeddb2a86bddd1b33c8a72a85191
            gate: quality
            command: "true"
          - pr: 2
            sha: 3010f97c48be0507334fe099ed52b40dede2fe52
            gate: quality
            command: "true"
          - pr: 3
            sha: ca75fc356d4778b4276771359f2f559e8446ab2c
            gate: quality
            command: "true"
          - pr: 4
            sha: a9df014248aba49340f4504de731a0e67d56f59c
            gate: quality
            command: "true"
          - pr: 5
            sha: f0a863fcab719daaef3ec6075ca3aeff7c5f812e
            gate: quality
            command: "true"
          - pr: 6
            sha: 0de94caa39fcc1f88859809c93ff9779df3108df
            gate: quality
            command: "true"
          - pr: 5
            sha: f0a863fcab719daaef3ec6075ca3aeff7c5f812e
            gate: cockpit
            command: "QA_BASE_URL=http://localhost:4173 node scripts/qa-cockpit-utility.mjs"
          - pr: 6
            sha: 0de94caa39fcc1f88859809c93ff9779df3108df
            gate: cockpit
            command: "QA_BASE_URL=http://localhost:4173 node scripts/qa-cockpit-utility.mjs"
          - pr: 2
            sha: 3010f97c48be0507334fe099ed52b40dede2fe52
            gate: focused
            command: "node .validation-qa/scripts/qa-osint-focused.mjs"
    env:
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.gate == 'quality' && '1' || '0' }}
      PUPPETEER_SKIP_DOWNLOAD: ${{ matrix.gate == 'quality' && '1' || '0' }}
      OSINT_PR: ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Required quality checks
        if: matrix.gate == 'quality'
        run: |
          npm run doctor -- --json
          npm run format:check
          npm run check:boundaries
          git fetch --depth=1 https://github.com/bilawalsidhu/gods-eye-view.git 533d7c64549a2df8a3c5325940f107d36680b322
          npm run layer-token:check -- --base-ref 533d7c64549a2df8a3c5325940f107d36680b322
          git diff --check 533d7c64549a2df8a3c5325940f107d36680b322 HEAD
          if npm test > unit.log 2>&1; then
            tail -n 30 unit.log
          else
            tail -n 100 unit.log
            exit 1
          fi
          if npm run build > build.log 2>&1; then
            tail -n 10 build.log
          else
            tail -n 80 build.log
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: matrix.gate == 'focused'
        with:
          ref: ${{ github.sha }}
          path: .validation-qa
          sparse-checkout: scripts/qa-osint-focused.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Start development server
        if: matrix.gate != 'quality'
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat dev.log
          exit 1
      - name: Run browser gate
        if: matrix.gate != 'quality'
        run: |
          if ${{ matrix.command }} > gate.log 2>&1; then
            tail -n 100 gate.log
          else
            tail -n 160 gate.log
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: osint-pr-${{ matrix.pr }}-${{ matrix.gate }}
          path: |
            qa-shots/
            qa-artifacts/
            gate.log
            dev.log
            unit.log
            build.log
          retention-days: 14
