name: Reconcile OSINT branches with current main
on:
  push:
    branches: [research/complete-osint-prs-20261015]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch current upstream
        run: git fetch https://github.com/bilawalsidhu/gods-eye-view.git 533d7c64549a2df8a3c5325940f107d36680b322
      - name: Resolve reviewed conflicts in temporary checkout
        run: node scripts/inspect-osint-merges.mjs
