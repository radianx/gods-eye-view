name: SINARAME viewer research
on:
  push:
    branches: [research/sinarame-viewer]
    paths:
      - scripts/research-sinarame.mjs
      - .github/workflows/sinarame-research.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install isolated browser probe
        run: npm install --prefix /tmp/sinarame-probe --no-audit --no-fund puppeteer@25.10.0
      - name: Inspect public viewer and anonymous image access
        run: node scripts/research-sinarame.mjs
      - name: Keep research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sinarame-viewer-research
          path: research-output/
          retention-days: 7
