name: Argentina CCTV playback diagnostic
on:
  push:
    branches: [research/argentina-webcams-20261015]
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WEBCAM_PACK: monte-hermoso
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c1eae49613aa60a9df51e90c20bebed495fafc29
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .webcam-qa
          sparse-checkout: |
            scripts/qa-argentina-webcams-prepare.mjs
            scripts/qa-argentina-webcams-live.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: node .webcam-qa/scripts/qa-argentina-webcams-prepare.mjs
      - name: Start development server
        env:
          CCTV_SOURCES_FILE: /tmp/gev-webcam-sources.json
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat dev.log
          exit 1
      - name: Verify public HLS playback through application relay
        run: node .webcam-qa/scripts/qa-argentina-webcams-live.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: monte-hermoso-playback-diagnostic
          path: |
            qa-artifacts/
            dev.log
          retention-days: 7
